<!DOCTYPE html>
<html>

<meta charset="utf-8">
<title>CAVE simulator</title>
<link type="text/css" rel="stylesheet" href="main.css">
</head>
<body>
<div id="info">
	CAVE Simulator. The head, the objects and the yellow probe are draggable. Use the panel to move the head, change the IOD and move/scale the scene. <br />
	"L" See from Left Eye | "R" See from Right Eye | "S" toggle show scene | "F" toggle frustums | "P" toggle parallax probe <br />
</div>
<div id="probeInfo"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DragControls } from 'three/addons/controls/DragControls.js';
import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

class DisplaySurface 
{
    constructor(name, origin, u_vector, v_vector) 
    {
        this.name = name;
        this.origin = origin;
        this.u = u_vector;
        this.v = v_vector;
    }

	viewMatrix(eye)
	{
		var normal = new THREE.Vector3().crossVectors(this.u, this.v).normalize();
		var target = eye.clone().sub(normal);
		var upVector = this.v.clone().normalize();
		var mat = new THREE.Matrix4();
		mat = mat.lookAt(eye, target, upVector).transpose();
		var translate = new THREE.Matrix4().makeTranslation(-eye.x, -eye.y, -eye.z);
		mat = mat.multiplyMatrices(mat, translate);
		return mat;
	}
	
    projectionMatrix(eye, znear, zfar)
    {
        var xAxis = this.u.clone().normalize();
        var yAxis = this.v.clone().normalize();
        var normal = new THREE.Vector3().crossVectors(this.u, this.v).normalize();

        var toP = new THREE.Vector3().subVectors(this.origin, eye);
        var toPu = toP.clone().add(this.u);
        var toPv = toP.clone().add(this.v);
        var dist = -toP.dot(normal);
        var scale = znear / dist;

        var left = toP.dot(xAxis) * scale;
        var right = toPu.dot(xAxis) * scale;
        var bottom = toP.dot(yAxis) * scale;
        var top = toPv.dot(yAxis) * scale;
        return new THREE.Matrix4().makePerspective(left, right, top, bottom, znear, zfar);
    }
}


var renderer, scene, camera;
var displaySurfaces, displaySurfaceScene, displaySurfaceTargets;
var eyeCenter, eyeScene; 
var orbitControl;
var showScene = true;
var sceneRoot, draggableObjects = [];
var params, gui;
var frustumLines, probeRayL, probeRayR, probeHitL, probeHitR;
var showFrustums = false, showProbe = true;

function addDragControlToObjects()
{
    var objects = draggableObjects.slice();
    objects.push(eyeScene.getObjectByName("Head"));

    var controls = new DragControls( objects, camera, renderer.domElement );
    controls.addEventListener( 'drag', function ( event )
	{
            if (event.object.name == "Head")
                syncHeadParams();
    } );
    controls.addEventListener( 'hoveron', function ( event ) 
		{
            orbitControl.enabled = false;
        } );
    controls.addEventListener( 'hoveroff', function ( event ) 
	{
            orbitControl.enabled = true;
    } );
	controls.addEventListener( 'dragstart', function ( event ) 
		{
            event.object.material.emissive.set( 0xaaaaaa );
        } );
    controls.addEventListener( 'dragend', function ( event ) 
		{
            event.object.material.emissive.set( 0x000000 );
    } );
}

function createEyeScene()
{
    var IPD = 6.8; 
    eyeCenter = new THREE.Vector3(50, 20, 50);
    // eye positions relative to the head
    var eyeL = new THREE.Vector3( - IPD/2, 10, -6);
    var eyeR = new THREE.Vector3( + IPD/2, 10, -6);
    
    eyeScene = new THREE.Scene();

    // add sphere representing head
    var geometry = new THREE.SphereGeometry( 10, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0xaaaaaa } );
    var head = new THREE.Mesh( geometry, material );
    head.name = "Head";
    head.position.set(eyeCenter.x, eyeCenter.y, eyeCenter.z);
    eyeScene.add(head);

    // add spheres representing L/R eyes
    var geometry = new THREE.SphereGeometry( 3, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0xff0000 } );
    var sphere = new THREE.Mesh( geometry, material );
    sphere.name = "EyeL";
    sphere.position.set(eyeL.x, eyeL.y, eyeL.z);
    head.add(sphere);
	
    var geometry = new THREE.SphereGeometry( 3, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0x0000ff } );
    var sphere = new THREE.Mesh( geometry, material );
    sphere.name = "EyeR";
    sphere.position.set(eyeR.x, eyeR.y, eyeR.z);
	head.add(sphere);
    
    createLights(eyeScene);
}

function createRenderer()
{
    renderer = new THREE.WebGLRenderer({preserveDrawingBuffer: true});
    renderer.autoClear = false;
    //renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
}

function onWindowResize()
{
    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
}

function enableOrbitCamera(cam, renderer)
{
    orbitControl = new OrbitControls(cam, renderer.domElement );
    orbitControl.minDistance = 0;
    orbitControl.maxDistance = 50000;
}

function createLights(scn)
{
    var ambientLight = new THREE.AmbientLight(0x888888, 0.7 * Math.PI);
    scn.add(ambientLight);

    // No distance attenuation: the simulator uses scene units at a large scale.
    var pointLight = new THREE.PointLight(0xffffff, 0.8 * Math.PI, 0, 0);
    pointLight.position.z += 200;
    scn.add(pointLight);
}

function addSceneObject(name, geometry, color, x, y, z)
{
    var material = new THREE.MeshPhongMaterial( { color: color } );
    var mesh = new THREE.Mesh(geometry, material);
    mesh.name = name;
    mesh.position.set(x, y, z);
    sceneRoot.add(mesh);
    draggableObjects.push(mesh);
    return mesh;
}

function createScene()
{
    scene = new THREE.Scene();
    sceneRoot = new THREE.Group();
    scene.add(sceneRoot);

    addSceneObject("Teapot", new TeapotGeometry(40, 15), 0xffffff, 0, 0, -70);
    addSceneObject("Knot", new THREE.TorusKnotGeometry(18, 5, 128, 16), 0xff8844, -110, 20, -40);
    addSceneObject("Box", new THREE.BoxGeometry(40, 40, 40), 0x44aaff, 70, -120, -60);
    addSceneObject("Ball", new THREE.SphereGeometry(30, 32, 22), 0x66dd66, -60, 60, -260);
    addSceneObject("Cone", new THREE.ConeGeometry(20, 60, 32), 0xdddd44, 115, -30, 10);
    addSceneObject("Probe", new THREE.SphereGeometry(4, 16, 12), 0xffff00, -20, 70, -10);

    createLights(scene);
}

function createHelpers()
{
    var positions = new Float32Array(displaySurfaces.length * 4 * 2 * 2 * 3);
    var colors = new Float32Array(positions.length);
    for (var i = 0; i < positions.length / 3; i++)
    {
        var isRight = Math.floor(i / (displaySurfaces.length * 8)) == 1;
        colors.set(isRight ? [0.2, 0.6, 1.0] : [1.0, 0.2, 0.2], i * 3);
    }
    var geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    frustumLines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ vertexColors: true }));
    frustumLines.frustumCulled = false;
    frustumLines.visible = showFrustums;
    eyeScene.add(frustumLines);

    probeRayL = createLine(0xff3333);
    probeRayR = createLine(0x3399ff);
    probeHitL = createMarker(0xff3333);
    probeHitR = createMarker(0x3399ff);
}

function createLine(color)
{
    var geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    var line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: color }));
    line.frustumCulled = false;
    eyeScene.add(line);
    return line;
}

function createMarker(color)
{
    var marker = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 12), new THREE.MeshBasicMaterial({ color: color }));
    eyeScene.add(marker);
    return marker;
}

function surfaceCorners(s)
{
    var p = s.origin;
    return [p.clone(), p.clone().add(s.u), p.clone().add(s.u).add(s.v), p.clone().add(s.v)];
}

function updateFrustumLines()
{
    frustumLines.visible = showFrustums;
    if (!showFrustums)
        return;

    var attribute = frustumLines.geometry.attributes.position;
    var eyes = [getLeftEyePosition(), getRightEyePosition()];
    var k = 0;
    for (var eye of eyes)
        for (var s of displaySurfaces)
            for (var corner of surfaceCorners(s))
            {
                attribute.setXYZ(k++, eye.x, eye.y, eye.z);
                attribute.setXYZ(k++, corner.x, corner.y, corner.z);
            }
    attribute.needsUpdate = true;
}

function intersectSurfaces(eye, point)
{
    var dir = new THREE.Vector3().subVectors(point, eye);
    var best = null;
    for (var s of displaySurfaces)
    {
        var normal = new THREE.Vector3().crossVectors(s.u, s.v).normalize();
        var denom = dir.dot(normal);
        if (Math.abs(denom) < 1e-9)
            continue;
        var t = new THREE.Vector3().subVectors(s.origin, eye).dot(normal) / denom;
        if (t <= 0 || (best && t >= best.t))
            continue;
        var hit = eye.clone().addScaledVector(dir, t);
        var local = new THREE.Vector3().subVectors(hit, s.origin);
        var a = local.dot(s.u) / s.u.lengthSq();
        var b = local.dot(s.v) / s.v.lengthSq();
        if (a >= 0 && a <= 1 && b >= 0 && b <= 1)
            best = { t: t, hit: hit, surface: s };
    }
    return best;
}

function setLine(line, from, to)
{
    var attribute = line.geometry.attributes.position;
    attribute.setXYZ(0, from.x, from.y, from.z);
    attribute.setXYZ(1, to.x, to.y, to.z);
    attribute.needsUpdate = true;
}

function updateProbe()
{
    var info = document.getElementById('probeInfo');
    var helpers = [probeRayL, probeRayR, probeHitL, probeHitR];
    for (var h of helpers)
        h.visible = showProbe;
    info.style.display = showProbe ? 'block' : 'none';
    if (!showProbe)
        return;

    var probe = scene.getObjectByName("Probe").getWorldPosition(new THREE.Vector3());
    var eyeL = getLeftEyePosition();
    var eyeR = getRightEyePosition();
    var hitL = intersectSurfaces(eyeL, probe);
    var hitR = intersectSurfaces(eyeR, probe);

    probeRayL.visible = probeHitL.visible = hitL != null;
    probeRayR.visible = probeHitR.visible = hitR != null;
    if (hitL) { setLine(probeRayL, eyeL, hitL.hit); probeHitL.position.copy(hitL.hit); }
    if (hitR) { setLine(probeRayR, eyeR, hitR.hit); probeHitR.position.copy(hitR.hit); }

    if (!hitL || !hitR)
    {
        info.textContent = "Probe: not projected onto any display surface";
        return;
    }
    if (hitL.surface != hitR.surface)
    {
        info.textContent = "Probe: L on " + hitL.surface.name + ", R on " + hitR.surface.name + " (split across two surfaces)";
        return;
    }

    var s = hitL.surface;
    var parallax = new THREE.Vector3().subVectors(hitR.hit, hitL.hit).dot(s.u.clone().normalize());
    var normal = new THREE.Vector3().crossVectors(s.u, s.v).normalize();
    var probeDepth = new THREE.Vector3().subVectors(probe, s.origin).dot(normal);
    var eyeDist = new THREE.Vector3().subVectors(eyeL.clone().add(eyeR).multiplyScalar(0.5), s.origin).dot(normal);
    var type = Math.abs(parallax) < 0.05 ? "zero parallax: on the screen plane"
             : parallax > 0 ? "positive parallax: appears behind the screen"
             : "negative parallax: appears in front of the screen";
    info.innerHTML = "Probe on <b>" + s.name + "</b> surface<br>"
        + "parallax = " + parallax.toFixed(2) + " cm (" + type + ")<br>"
        + "IOD = " + eyeL.distanceTo(eyeR).toFixed(2) + " cm, eye-screen = " + eyeDist.toFixed(1)
        + " cm, probe-screen = " + probeDepth.toFixed(1) + " cm";
}

function updateIOD()
{
    eyeScene.getObjectByName("EyeL").position.x = -params.iod / 2;
    eyeScene.getObjectByName("EyeR").position.x = params.iod / 2;
}

function updateHead()
{
    var head = eyeScene.getObjectByName("Head");
    head.position.set(params.headX, params.headY, params.headZ);
    head.rotation.y = THREE.MathUtils.degToRad(params.headYaw);
}

function syncHeadParams()
{
    var head = eyeScene.getObjectByName("Head");
    params.headX = head.position.x;
    params.headY = head.position.y;
    params.headZ = head.position.z;
}

function updateSceneTransform()
{
    sceneRoot.position.set(params.sceneX, params.sceneY, params.sceneZ);
    sceneRoot.scale.setScalar(params.sceneScale);
}

function viewFromEye(eye)
{
    var head = eyeScene.getObjectByName("Head");
    var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(head.quaternion);
    camera.position.copy(eye);
    orbitControl.target.copy(eye).add(forward);
    orbitControl.update();
}

function createGUI()
{
    var head = eyeScene.getObjectByName("Head");
    params = {
        headX: head.position.x, headY: head.position.y, headZ: head.position.z, headYaw: 0,
        iod: 6.8,
        sceneX: 0, sceneY: 0, sceneZ: 0, sceneScale: 1,
        showScene: showScene, showFrustums: showFrustums, showProbe: showProbe,
        leftEye: function () { viewFromEye(getLeftEyePosition()); },
        rightEye: function () { viewFromEye(getRightEyePosition()); },
        resetView: function ()
        {
            camera.position.set(100, 100, 300);
            orbitControl.target.set(0, 0, 0);
            orbitControl.update();
        }
    };

    gui = new GUI();

    var headFolder = gui.addFolder('Head / eyes');
    headFolder.add(params, 'headX', -150, 150, 1).name('head x').onChange(updateHead).listen();
    headFolder.add(params, 'headY', -150, 150, 1).name('head y').onChange(updateHead).listen();
    headFolder.add(params, 'headZ', -150, 150, 1).name('head z').onChange(updateHead).listen();
    headFolder.add(params, 'headYaw', -180, 180, 1).name('head yaw (deg)').onChange(updateHead);
    headFolder.add(params, 'iod', 0, 20, 0.1).name('IOD (cm)').onChange(updateIOD);

    var sceneFolder = gui.addFolder('Scene');
    sceneFolder.add(params, 'sceneX', -200, 200, 1).name('move x').onChange(updateSceneTransform);
    sceneFolder.add(params, 'sceneY', -200, 200, 1).name('move y').onChange(updateSceneTransform);
    sceneFolder.add(params, 'sceneZ', -300, 200, 1).name('move z').onChange(updateSceneTransform);
    sceneFolder.add(params, 'sceneScale', 0.1, 3, 0.01).name('scale').onChange(updateSceneTransform);

    var viewFolder = gui.addFolder('View');
    viewFolder.add(params, 'showScene').name('show scene (S)').onChange(function (v) { showScene = v; }).listen();
    viewFolder.add(params, 'showFrustums').name('show frustums (F)').onChange(function (v) { showFrustums = v; }).listen();
    viewFolder.add(params, 'showProbe').name('parallax probe (P)').onChange(function (v) { showProbe = v; }).listen();
    viewFolder.add(params, 'leftEye').name('see from left eye (L)');
    viewFolder.add(params, 'rightEye').name('see from right eye (R)');
    viewFolder.add(params, 'resetView').name('reset camera');
}

// create a scene with 3D objects representing the display surfaces
function createDisplaySurfaceScene()
{
    displaySurfaceScene = new THREE.Scene();

    // add display surfaces
    for (var [index, displaySurface] of displaySurfaces.entries())
    {
        var origin = displaySurface.origin;
        var u = displaySurface.u;
        var v = displaySurface.v;
  
        var geometry = new THREE.BoxGeometry(u.length(), v.length(), 0.01);
        var material = new THREE.MeshBasicMaterial( {map: displaySurfaceTargets[index].texture} );
        var cube = new THREE.Mesh( geometry, material );
        cube.name = displaySurface.name;
        if (displaySurface.name == "Left")
            cube.rotation.y = Math.PI / 2;
       
		if (displaySurface.name == "Right")
            cube.rotation.y = - Math.PI / 2;
			
		if (displaySurface.name == "Floor")
		{
            cube.rotation.x =  Math.PI / 2;
			cube.rotation.z =  Math.PI ;
		}
       
	    var uHalf = u.clone().multiplyScalar(0.5);
		var vHalf = v.clone().multiplyScalar(0.5);
		var center = new THREE.Vector3().addVectors(origin, uHalf);
		center.add(vHalf);
		cube.position.set(center.x, center.y, center.z);
		
        displaySurfaceScene.add(cube);
    }
    
    createLights(displaySurfaceScene);
}

function createDisplaySurfaceTargets()
{
    const SIZE = 1024;  // texture resolution
    displaySurfaceTargets = [];
    
    for (var v of displaySurfaces)       
        displaySurfaceTargets.push(new THREE.WebGLRenderTarget(SIZE, SIZE));
}


function createCamera()
{
    camera = new THREE.PerspectiveCamera( 75, window.innerWidth/window.innerHeight, 0.1, 10000 );
    camera.position.set( 100, 100, 300 );
    camera.lookAt( 0, 0, 0 );
}

function createDisplaySurfaces()
{
    displaySurfaces = [];
    // FRONT SCREEN
    var frontScreen = new DisplaySurface("Front", 
        new THREE.Vector3(-150.0, -150.0, -150.0), 
        new THREE.Vector3(300.0, 0.0,   0.0), 
        new THREE.Vector3(0.0, 300.0,   0.0));
    displaySurfaces.push(frontScreen);

    // LEFT SCREEN
    var leftScreen = new DisplaySurface("Left",
        new THREE.Vector3(-150.0, -150.0, 150.0), 
        new THREE.Vector3(0.0, 0.0,  -300.0), 
        new THREE.Vector3(0.0, 300.0,   0.0));
    displaySurfaces.push(leftScreen);
	
    var rightScreen = new DisplaySurface("Right",
        new THREE.Vector3(150.0, -150.0, -150.0),
        new THREE.Vector3(0.0, 0.0,   300.0),
        new THREE.Vector3(0.0, 300.0,   0.0));
    displaySurfaces.push(rightScreen);

    var floorScreen = new DisplaySurface("Floor",
        new THREE.Vector3(-150.0, -150.0, 150.0),
        new THREE.Vector3(300.0, 0.0,   0.0),
        new THREE.Vector3(0.0, 0.0,  -300.0));
    displaySurfaces.push(floorScreen);
}

function getLeftEyePosition()
{
    var eye = eyeScene.getObjectByName("EyeL");
    return eye.getWorldPosition(new THREE.Vector3());
}

function getRightEyePosition()
{
    var eye = eyeScene.getObjectByName("EyeR");
    return eye.getWorldPosition(new THREE.Vector3());
}

function cameraFromViewProj(view, proj)
{
	var cam = camera.clone();
    var inv = new THREE.Matrix4();
	inv.copy(view).invert();
	cam.position.set(inv.elements[12], inv.elements[13], inv.elements[14]);
	cam.setRotationFromMatrix(inv);
	cam.projectionMatrix = proj.clone();
	return cam;
}

// refresh function
var animate = function () {
    var gl = renderer.getContext();
    requestAnimationFrame(animate);

    // 1. render scene objects
	renderer.setClearColor(0x808080);
    renderer.clear();
    if (showScene)
        renderer.render(scene, camera);
    
    // 2. render scene objects onto a texture, for each target
    for (let [index, displaySurface] of displaySurfaces.entries())
    {
        renderer.setRenderTarget(displaySurfaceTargets[index]);
        renderer.setClearColor(0x404040);
        renderer.clear();

		// left eye on RED channel
        gl.colorMask(1, 0, 0, 0); 
		var eye = getLeftEyePosition();
		var view = displaySurface.viewMatrix(eye);
		var proj = displaySurface.projectionMatrix(eye, 1, 10000);
        var leftCamera = cameraFromViewProj(view, proj);
        renderer.render(scene, leftCamera); 
    
		// right eye on GREEN, BLUE channels
		gl.colorMask(0, 1, 1, 0);
		var eye = getRightEyePosition();
		var view = displaySurface.viewMatrix(eye);
		var proj = displaySurface.projectionMatrix(eye, 1, 10000);
        var rightCamera = cameraFromViewProj(view, proj);
        renderer.clearDepth();
        renderer.render(scene, rightCamera); 
		
        gl.colorMask(1, 1, 1, 1);
    }
    // restore state
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000);

    updateFrustumLines();
    updateProbe();

    // 3. render display surfaces as (textured) quads
    renderer.render(displaySurfaceScene, camera);
	
	// 4. render eyes
    renderer.render(eyeScene, camera);
	
};


window.addEventListener( 'keydown', function ( event ) 
{
        switch ( event.code ) {
            case 'KeyL':
                viewFromEye(getLeftEyePosition());
                break;

            case 'KeyR':
                viewFromEye(getRightEyePosition());
                break;

            case 'KeyS':
                showScene = !showScene;
                params.showScene = showScene;
                break;

            case 'KeyF':
                showFrustums = !showFrustums;
                params.showFrustums = showFrustums;
                break;

            case 'KeyP':
                showProbe = !showProbe;
                params.showProbe = showProbe;
                break;
				
			case 'KeyT':
				var viewF = displaySurfaces[0].viewMatrix(new THREE.Vector3(50,20,100));
				var viewL = displaySurfaces[1].viewMatrix(new THREE.Vector3(50,20,100));
				//var viewR = displaySurfaces[2].viewMatrix(new THREE.Vector3(50,20,100));

				console.log("View matrices:");
				console.log(viewF);
				console.log(viewL);

				//console.log(viewB);
				break;
                
                    
}
});



createRenderer();  			// create WebGL renderer
createDisplaySurfaces();	// Display surfaces
createDisplaySurfaceTargets(); // Textures for the display surfaces
createDisplaySurfaceScene();	// 3D objects for the display surfaces
createEyeScene();	// spheres representing head + eyes
createScene();		// some objects to test (teapot...)
createCamera();		// a third-person camera
window.addEventListener('resize', onWindowResize);
enableOrbitCamera(camera, renderer);  // basic camera control
addDragControlToObjects();	// allow some objects to be dragged
createHelpers();
createGUI();
animate();


		</script>
    </body>
</html>
